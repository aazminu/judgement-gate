# Org judgement config. Put this at .github/judgement-gate.yml in your organisation's `.github` repo
# and protect it with CODEOWNERS: whoever owns this file owns the org's judgement.
# It is always read from the default branch, so a PR cannot change the rules that gate it.
#
# Note: a non-empty list REPLACES the default. List `use: one-way-door` to keep it running.
judgements:
  # Built-in: is this a one-way door? Optional overrides: confidence_threshold, applies_to.
  - use: one-way-door
    confidence_threshold: 0.75

  # Declarative: one yes/no question for the model, a threshold, and how an author clears it.
  - id: public-api-contract
    name: Public API contract change
    question: "Does this change break or remove a public API contract?"
    true: "removes/renames endpoints, fields or exported symbols"
    false: "additive or internal only"
    threshold: 0.6                       # flagged when P(true) >= threshold
    applies_to: ["services/api/**"]      # only judged when a changed file matches
    satisfied_by:                        # required; any one entry clears the flag
      - pr_body_matches: "(?i)^Migration Plan:"
      - file_added: "docs/api-changes/*.md"
    why: "Consumers cannot roll back with us. Breaking changes need a migration plan."
    fix: "Add a 'Migration Plan:' line to the PR description, or a note under docs/api-changes/."
