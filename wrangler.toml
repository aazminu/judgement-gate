name = "judgement-gate"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[vars]
# shadow = check always passes (informational); enforce = real success/failure
MODE = "shadow"
# Review routing (needs-human-review label) has its own mode and defaults to MODE when unset. Set it to pilot
# routing in shadow while the check enforces, or the reverse. Only enforce adds the label.
# ROUTING_MODE = "shadow"
JEV_MODEL = "typesafe/jev-1.14"
JEV_API_URL = "https://openrouter.ai/api/alpha/decisions"
JEV_TIMEOUT_MS = "2500"
GITHUB_API_URL = "https://api.github.com"
# PRD default is 0.75. Jev's `confidence` measures concentration (0.66/0.34 -> 0.32), so tune in shadow mode.
CONFIDENCE_THRESHOLD = "0.75"
# Repo (in the PR's owner) that holds .github/judgement-gate.yml. Read from its default branch.
CONFIG_REPO = ".github"
# Secrets (wrangler secret put): GITHUB_WEBHOOK_SECRET, GITHUB_APP_ID, GITHUB_APP_PRIVATE_KEY (PKCS#8 PEM), JEV_API_KEY

# Optional: calibration events (see docs/calibration.md). Remove this block to disable; the Worker runs fine without it.
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "judgement_gate"
